<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Mirror — Sender</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #ddd;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        height: 100vh;
      }
      .sender-panel {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        min-width: 280px;
      }
      h1 {
        font-size: 1.3rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      button#start {
        padding: 0.6rem 1.8rem;
        font-size: 1rem;
        font-family: inherit;
        border: 1px solid #555;
        background: #1e1e1e;
        color: #ddd;
        border-radius: 4px;
        cursor: pointer;
        align-self: flex-start;
      }
      button#start:hover {
        border-color: #888;
        color: #fff;
      }
      /* Phase 9 — dead-session buttons (hidden until "dead" event) */
      button#retry,
      button#cancel {
        padding: 0.5rem 1.4rem;
        font-size: 0.9rem;
        font-family: inherit;
        border: 1px solid #555;
        background: #1e1e1e;
        color: #ddd;
        border-radius: 4px;
        cursor: pointer;
      }
      button#retry { border-color: #4a9; color: #8ef; }
      button#retry:hover { border-color: #6cb; color: #aff; }
      button#cancel { border-color: #844; color: #f88; }
      button#cancel:hover { border-color: #a66; color: #faa; }
      .dead-buttons {
        display: flex;
        gap: 0.5rem;
      }
      #status {
        font-size: 0.8rem;
        font-family: ui-monospace, monospace;
        color: #777;
      }
      #error {
        font-size: 0.8rem;
        font-family: ui-monospace, monospace;
        color: #e55;
        min-height: 1.2em;
      }
      .back-link {
        font-size: 0.8rem;
        color: #777;
        text-decoration: underline;
      }
      .back-link:hover {
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div class="sender-panel">
      <h1>Sender</h1>

      <button id="start">Start streaming</button>

      <!-- Phase 9 — dead-session modal: hidden by default, shown on "dead" event -->
      <div class="dead-buttons">
        <button id="retry" hidden>Retry</button>
        <button id="cancel" hidden>Cancel</button>
      </div>

      <div id="status">Not connected</div>
      <div id="error"></div>

      <a class="back-link" href="./index.html" id="change-mode">Change mode</a>
    </div>
    <script>
      // Clear lastMode on change-mode click so landing page does not auto-route
      // back to sender.html (commit 60d9ce7 / dual-mode-shell R5.4 ext).
      document.getElementById("change-mode").addEventListener("click", function () {
        localStorage.removeItem("sm.lastMode");
      });
    </script>
    <script src="./sender.js"></script>
  </body>
</html>
