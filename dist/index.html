<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Mirror</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #ddd;
        font-family: system-ui, sans-serif;
      }
      #stage {
        display: grid;
        place-items: center;
        height: 100vh;
      }
      video {
        max-width: 100%;
        max-height: 100%;
        background: #000;
      }
      #status {
        position: fixed;
        bottom: 8px;
        left: 8px;
        font-size: 12px;
        opacity: 0.7;
        font-family: ui-monospace, monospace;
      }
      /* ── R10.2 smoke section (debug) ────────────────────────────────── */
      #smoke-section {
        position: fixed;
        top: 0;
        right: 0;
        width: 360px;
        padding: 0.5rem;
        background: rgba(0, 0, 0, 0.75);
        font-size: 11px;
        font-family: ui-monospace, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        display: none; /* hidden by default; open DevTools console to see logs */
      }
    </style>
  </head>
  <body>
    <!-- R11.1: <video> element with autoplay + muted (R11.8) -->
    <div id="stage">
      <video id="player" autoplay muted playsinline></video>
    </div>

    <!-- Status line for MSE state -->
    <div id="status">starting…</div>

    <!-- R11.7: no import / require — plain module script -->
    <script type="module" src="./mse-client.js"></script>

    <!-- R10.2 smoke test (retained for debug builds) -->
    <div id="smoke-section">
      <strong>R10.2 smoke</strong>
      <div id="smoke-status" class="pending">running...</div>
      <button id="smoke-rerun" type="button">Re-run</button>
    </div>
    <script type="module">
      // R10.2 smoke: only runs if the smoke section is made visible.
      const invoke = window.__TAURI__?.core?.invoke;
      const smokeStatus = document.getElementById("smoke-status");

      async function runSmoke() {
        if (!invoke || !smokeStatus) return;
        smokeStatus.textContent = "running smoke_com_apartment (up to 10s)...";
        try {
          const msg = await invoke("smoke_com_apartment");
          smokeStatus.textContent = msg;
        } catch (err) {
          smokeStatus.textContent = String(err);
        }
      }

      document
        .getElementById("smoke-rerun")
        ?.addEventListener("click", runSmoke);
    </script>
  </body>
</html>
