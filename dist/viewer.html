<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Mirror — Receiver</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #ddd;
        font-family: system-ui, sans-serif;
      }
      #stage {
        display: grid;
        place-items: center;
        height: 100vh;
      }
      video {
        max-width: 100%;
        max-height: 100%;
        background: #000;
      }
      #status {
        position: fixed;
        bottom: 8px;
        left: 8px;
        font-size: 12px;
        opacity: 0.7;
        font-family: ui-monospace, monospace;
      }
      /* ── Phase 9 — reconnecting overlay and dead-session modal ─────── */
      #reconnecting-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        font-family: ui-monospace, monospace;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      #dead-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        color: #ddd;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        z-index: 11;
      }
      #dead-modal p { margin: 0; font-size: 1rem; }
      #dead-modal .dead-buttons { display: flex; gap: 0.75rem; }
      #receiver-retry, #receiver-cancel {
        padding: 0.5rem 1.4rem;
        font-size: 0.9rem;
        font-family: inherit;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid #555;
        background: #1e1e1e;
        color: #ddd;
      }
      #receiver-retry { border-color: #4a9; color: #8ef; }
      #receiver-cancel { border-color: #844; color: #f88; }
      /* ── R10.2 smoke section (debug) ────────────────────────────────── */
      #smoke-section {
        position: fixed;
        top: 0;
        right: 0;
        width: 360px;
        padding: 0.5rem;
        background: rgba(0, 0, 0, 0.75);
        font-size: 11px;
        font-family: ui-monospace, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        display: none; /* hidden by default; open DevTools console to see logs */
      }
    </style>
  </head>
  <body>
    <!-- R11.1: <video> element with autoplay + muted (R11.8) -->
    <div id="stage">
      <video id="player" autoplay muted playsinline></video>
    </div>

    <!-- Status line for MSE state -->
    <div id="status">starting…</div>

    <!-- Phase 9 — reconnecting overlay: hidden by default, shown by handleStatus("reconnecting") -->
    <div id="reconnecting-overlay" hidden>Reconnecting…</div>

    <!-- Phase 9 — dead-session modal: hidden by default, shown by handleStatus("dead") -->
    <div id="dead-modal" hidden>
      <p id="dead-reason">Connection lost</p>
      <div class="dead-buttons">
        <button id="receiver-retry">Retry</button>
        <button id="receiver-cancel">Cancel</button>
      </div>
    </div>

    <!-- R6/R7 — Change mode link: nav-guarded by inline script below -->
    <a id="change-mode" href="./index.html" style="position:fixed;bottom:8px;right:8px;font-size:12px;color:#777;font-family:ui-monospace,monospace;text-decoration:underline;">Change mode</a>

    <!-- R6/R7 inline guard — must execute BEFORE mse-client.js module so  -->
    <!-- the flag exists on window when mse-client sets it to true.         -->
    <script>
      // R6 — initialize flag to false; mse-client.js sets it true after
      // start_stream succeeds (amended R9.1 / #339).
      window.__sm_streamActive = false;

      // R7.1 / R7.3 — beforeunload: surface native dialog on window-close
      // while streaming. Cannot truly await async work here (browser unloads
      // synchronously). The explicit nav path (click handler below) is the
      // load-bearing block for stop_stream; this handler covers window-close
      // via orphan-cleanup fallback per R7.3.
      window.addEventListener("beforeunload", function (event) {
        if (window.__sm_streamActive === true) {
          event.preventDefault();
          event.returnValue = "Streaming will be stopped.";
        }
      });

      // R7.2 — click handler on the change-mode link.
      // If a stream is active: confirm → await stop_stream → clear flag →
      // clear localStorage preference → navigate.
      // If stream is not active: navigate directly (no confirm needed).
      // On cancel: prevent navigation.
      document.addEventListener("DOMContentLoaded", function () {
        var link = document.getElementById("change-mode");
        if (!link) return;
        link.addEventListener("click", function (e) {
          if (!window.__sm_streamActive) return; // not streaming — allow default nav

          e.preventDefault();
          var ok = confirm("Stop streaming and leave this page?");
          if (!ok) return; // R7.2(c) — cancel: abort navigation

          // R7.2(b) — confirm: stop stream, clear flag, clear mode, navigate.
          // invoke() is provided by Tauri's withGlobalTauri: true binding.
          var invoke = window.__TAURI__?.core?.invoke;
          (invoke ? invoke("stop_stream") : Promise.resolve())
            .catch(function (err) {
              console.warn("[viewer] stop_stream error during nav:", err);
            })
            .finally(function () {
              window.__sm_streamActive = false;
              localStorage.removeItem("sm.lastMode");
              window.location.assign("./index.html");
            });
        });
      });
    </script>

    <!-- R11.7: no import / require — plain module script -->
    <script type="module" src="./mse-client.js"></script>

    <!-- R10.2 smoke test (retained for debug builds) -->
    <div id="smoke-section">
      <strong>R10.2 smoke</strong>
      <div id="smoke-status" class="pending">running...</div>
      <button id="smoke-rerun" type="button">Re-run</button>
    </div>
    <script type="module">
      // R10.2 smoke: only runs if the smoke section is made visible.
      const invoke = window.__TAURI__?.core?.invoke;
      const smokeStatus = document.getElementById("smoke-status");

      async function runSmoke() {
        if (!invoke || !smokeStatus) return;
        smokeStatus.textContent = "running smoke_com_apartment (up to 10s)...";
        try {
          const msg = await invoke("smoke_com_apartment");
          smokeStatus.textContent = msg;
        } catch (err) {
          smokeStatus.textContent = String(err);
        }
      }

      document
        .getElementById("smoke-rerun")
        ?.addEventListener("click", runSmoke);
    </script>
  </body>
</html>
