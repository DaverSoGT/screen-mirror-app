[package]
name = "screen-mirror"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "screen_mirror_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = "1"
sm-domain = { workspace = true }
sm-infra = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# custom-protocol is activated by tauri-build when bundling; do not remove.
custom-protocol = ["tauri/custom-protocol"]
