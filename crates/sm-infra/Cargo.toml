[package]
name = "sm-infra"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Default: hw-encoder is ON. Bucket A bugs (async event priming, GetEvent
# stop-signal starvation, pump_loop deadlocks) were closed in Slice 6 R2
# (PR #22, archive #816). ForceKeyFrame via ICodecAPI VT_UI4 BEFORE
# ProcessInput is now vendor-uniform on both Intel QSV and NVIDIA NVENC.
# Automatic SW fallback: if WindowsMftH264Encoder::new returns InitFailed,
# build_video_encoder silently promotes WindowsOpenH264Encoder. To force
# software-only at runtime without rebuilding, set:
#   SCREEN_MIRROR_FORCE_SOFTWARE_ENCODER=1
default = ["hw-encoder"]
# Reserved for V2 Media Foundation MFT hardware decoder adapter.
# Empty in V1 — no code is gated behind it yet.
hw-decoder = []
# Gates the WindowsMftH264Encoder MFT adapter and its windows crate dependency.
# Enabled by default since v0.2.0 (Slice 6 R2 closure). Automatic SW fallback
# is active — no GPU required to run the binary or the unit-test suite.
hw-encoder = []
# Exposes test-support helpers (NicOverrideGuard, enumerate_local_ipv4_raw)
# for use in integration tests outside this crate. Never enable in production.
test-support = []

[dependencies]
sm-domain = { path = "../sm-domain" }
str0m = { version = "0.18", default-features = false, features = ["rust-crypto"] }
mdns-sd = "0.19"
if-addrs = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
rayon = "1"
socket2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2"
windows-version = "0.1"
openh264 = "0.9"
openh264-sys2 = "0.9"
# Direct pin matching windows-capture's transitive resolution (Cargo.lock line 5316).
# Exact version prevents silent upgrade past windows-capture's pin (discovery #571).
# Features selected to cover all MFT/CodecAPI symbols used in windows_mft.rs (design §9).
# Win32_System_Com_StructuredStorage is included defensively; dropped if cargo check proves unused.
windows = { version = "0.62.2", features = [
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
] }

[target.'cfg(target_os = "macos")'.dependencies]

[target.'cfg(target_os = "linux")'.dependencies]

[dev-dependencies]
mp4 = "0.14.0"
# Self-referential dev-dependency: activates the test-support feature for
# integration tests in crates/sm-infra/tests/. Integration tests link against
# the library (not the #[cfg(test)] build), so test-support is the only way to
# expose NicOverrideGuard and enumerate_local_ipv4 to them.
sm-infra = { path = ".", features = ["test-support"] }
# Subscriber so HW smoke tests can show tracing output via RUST_LOG (the lib
# uses `tracing` macros but does not install a subscriber — that is the
# binary's job).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
