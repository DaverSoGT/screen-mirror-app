# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# Requires cargo-deny >= 0.14 (v2 config schema).

[licenses]
# Allow common permissive licences used by the Rust ecosystem.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
# Deny copyleft licences that would affect our proprietary distribution.
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
]
# Treat unlicensed or ambiguous crates as errors.
unlicensed = "deny"
# Warn on crates where licence could not be determined from metadata.
copyleft = "warn"
# Confidence threshold for licence text detection (0.0 – 1.0).
confidence-threshold = 0.8

[advisories]
# Deny crates that have been yanked from crates.io.
yanked = "deny"
# Warn on crates that are unmaintained (but do not block the build).
unmaintained = "warn"
# Warn on crates with unsound code notices.
unsound = "warn"

[bans]
# Warn (rather than error) when multiple versions of the same crate are pulled in.
# This is expected during early dependency graph growth; tighten to "deny" later.
multiple-versions = "warn"
# Deny wildcard dependencies (version = "*") — forces explicit pinning.
wildcards = "deny"

[sources]
# Only allow crates from the official registry and local workspace paths.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
